    <section class="contact">
        <div class="container">
            <div class="row align-items-stretch mb-5 text-center">
                <div class="col-md-6"> <h4> jess.m.design.contact@gmail.com</h4> </div>

            </div>

            <!-- Contact Form (Formspree) -->
            <form id="contactForm" action="https://formspree.io/f/myzevoqw" method="POST">
                <div class="row align-items-stretch mb-5">
                    <div class="col-md-6">
                        <div class="form-group">
                            <!-- Name -->
                            <input class="form-control" type="text" name="name" placeholder="Your Name *" required>
                        </div>
                        <div class="form-group">
                            <!-- Email -->
                            <input class="form-control" type="email" name="email" placeholder="Your Email *" required>
                        </div>
                        <div class="form-group mb-md-0">
                            <!-- Phone -->
                            <input class="form-control" type="tel" name="phone" placeholder="Your Phone">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group form-group-textarea mb-md-0">
                            <!-- Message -->
                            <textarea class="form-control" name="message" placeholder="Your Message *"
                                required></textarea>
                        </div>
                    </div>
                </div>

                <!-- Success message -->
                <div class="d-none alert alert-success text-center" id="submitSuccessMessage">
                    <div class="fw-bolder">✅ Form submission successful!</div>
                    I’ll get back to you as soon as possible.
                </div>

                <!-- Error message -->
                <div class="d-none alert alert-danger text-center" id="submitErrorMessage">
                    ❌ Oops! There was a problem submitting your form.
                </div>

                <!-- Submit button -->
                <div class="text-center">
                    <button class="btn btn-primary btn-xl text-uppercase" id="submitButton" type="submit">
                        <span id="buttonText">Send Message</span>
                        <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"
                            aria-hidden="true"></span>
                    </button>
                </div>
            </form>




        </div>
    </section>





    <!-- Formspree JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("contactForm");
            const successMessage = document.getElementById("submitSuccessMessage");
            const errorMessage = document.getElementById("submitErrorMessage");
            const submitButton = document.getElementById("submitButton");
            const buttonText = document.getElementById("buttonText");
            const buttonSpinner = document.getElementById("buttonSpinner");

            form.addEventListener("submit", async function (e) {
                e.preventDefault(); // stop normal submit
                const formData = new FormData(form);

                // Disable button + show spinner
                submitButton.disabled = true;
                buttonSpinner.classList.remove("d-none");

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        form.reset();
                        successMessage.classList.remove("d-none");
                        errorMessage.classList.add("d-none");
                    } else {
                        throw new Error("Network response was not ok");
                    }
                } catch (error) {
                    successMessage.classList.add("d-none");
                    errorMessage.classList.remove("d-none");
                } finally {
                    // Re-enable button + hide spinner
                    submitButton.disabled = false;
                    buttonSpinner.classList.add("d-none");
                }
            });
        });
    </script>
